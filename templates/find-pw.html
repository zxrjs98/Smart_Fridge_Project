<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshKeep - 비밀번호 찾기</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        /* findid.html과 디자인 동일 */
        body { background-color: #f4f6f8; margin: 0; display: flex; justify-content: center; font-family: 'Pretendard', sans-serif; }
        .app-container { width: 100%; max-width: 480px; min-height: 100vh; background-color: #f9f9f9; box-shadow: 0 0 15px rgba(0,0,0,0.05); }
        .header { display: flex; align-items: center; padding: 15px 20px; background-color: #ffffff; border-bottom: 1px solid #eee; }
        .back-btn { background-color: #ffffff; border: 1px solid #ccc; border-radius: 10px; color: #333; font-size: 32px !important; width: 50px; height: 50px; margin-right: 15px; display: flex; align-items: center; justify-content: center; text-decoration: none; padding-bottom: 4px; }
        .header h1 { margin: 0; font-size: 20px; color: #333; }
        
        .content-area { padding: 20px; }
        .find-box { background: #fff; padding: 25px; border-radius: 12px; border: 1px solid #eee; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 14px; color: #666; margin-bottom: 8px; font-weight: bold; }
        .form-group input { width: 100%; padding: 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; box-sizing: border-box; }
        
        .submit-btn { width: 100%; padding: 15px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; background: #333; color: #fff; cursor: pointer; }
        .submit-btn:hover { background: #555; }
        
        .alert-success { background-color: #d4edda; color: #155724; padding: 15px; border-radius: 8px; margin-top: 15px; font-weight: bold; text-align: center; word-break: keep-all; line-height: 1.5; }
        
        .bottom-links { text-align: center; margin-top: 25px; }
        .bottom-links a { color: #888; font-size: 14px; text-decoration: none; margin: 0 10px; }
        .bottom-links a:hover { color: #333; text-decoration: underline; }
    </style>
</head>
<body>
<div class="app-container">
    <div class="header">
        <a href="/" class="back-btn">←</a>
        <h1>비밀번호 찾기</h1>
    </div>
    <div class="content-area">
        <div class="find-box">
            <p style="font-size: 14px; color: #888; margin-top: 0; margin-bottom: 20px;">가입하신 계정 정보를 입력하시면<br>이메일로 임시 비밀번호를 발송해 드립니다.</p>
            <form action="/find-pw" method="POST">
                <div class="form-group">
                    <label>아이디</label>
                    <input type="text" name="username" required placeholder="아이디 입력" autocomplete="off">
                </div>
                <div class="form-group">
                    <label>이메일 주소</label>
                    <input type="email" name="email" required placeholder="example@email.com" autocomplete="off">
                </div>
                <button type="submit" style="background-color: #4A90E2; color: white; border: none; padding: 15px; border-radius: 8px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 20px;">
            임시 비밀번호 발송
        </button>
            </form>

            <!-- 1. 성공 시 (구분선 + 텍스트 + 다시 보내기) -->
            {% if pw_message %}
            <div style="margin-top: 30px; text-align: center; border-top: 1px dashed #ccc; padding-top: 20px;">
                <p style="font-weight: bold; color: #333; margin-bottom: 5px;">{{ pw_message }}</p>
                
                {% if success %}
                <p style="font-size: 0.9em; color: #666; margin-bottom: 15px;">메일함을 확인해 주세요.</p>
                <a href="javascript:location.reload();" style="font-size: 0.85em; color: #888; text-decoration: underline; cursor: pointer;">
                    이메일이 안 오나요? 다시 보내기
                </a>
                {% endif %}
            </div>
            {% endif %}

            <!-- 2. 에러 발생 시 (상자 없이 빨간색 작은 글씨) -->
            {% if pw_error %}
            <div style="margin-top: 15px; text-align: center;">
                <p style="color: #d9534f; font-size: 13px; font-weight: 500;">
                    {{ pw_error }}
                </p>
            </div>
            {% endif %}
        </div>

    </div>
</div>
</body>
</html>
